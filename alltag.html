
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Tags</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
    </nav>

    <main>
        <section id="home">
            <h2>Welcome</h2>
            <p>This is a <strong>paragraph</strong>.</p>
            <img src="apple.webp" alt="Sample image" width="100">
        </section>

        <article id="about">
            <h2>About HTML</h2>
            <p>HTML creates webpages. <em>It is useful!</em></p>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
            </ul>
        </article>

        <aside>
            <p>Related information</p>
        </aside>

        <details>
            <summary>Learn more</summary>
            <p>HTML uses tags.</p>
        </details>

        <form>
            <label for="name">Name:</label>
            <input id="name" type="text">
            <button type="submit">Submit</button>
        </form>

        <table>
            <tr><th>Name</th><th>Age</th></tr>
            <tr><td>John</td><td>20</td></tr>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
